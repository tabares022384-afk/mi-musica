<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13232a">
<meta name="description" content="Reproductor de música para el teléfono: estatus, favoritas, listas inteligentes, historial, respaldo y modo carro.">
<title>Mi Música</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{--bg:#0d1619;--panel:#13232a;--panel2:#183039;--linea:#24434d;--texto:#e6f1f3;--suave:#a3bcc3;--acento:#3fd0c9;--acento-t:#062322;
--bien:#3fcf8e;--mal:#ff6b6b;--aviso:#ffb454;--corazon:#ff5c8a;--estrella:#f2b705;color-scheme:dark}
:root[data-tema="claro"]{--bg:#eef3f4;--panel:#ffffff;--panel2:#e3eff1;--linea:#bcd0d5;--texto:#0d1619;--suave:#45606a;--acento:#0B4F5C;--acento-t:#ffffff;
--bien:#0f7d4c;--mal:#c62828;--aviso:#a35f00;--corazon:#d81b60;--estrella:#b07d00;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
/* Sin «bajar para recargar»: recargar hace que Android pida otra vez el permiso de la carpeta */
body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;
  padding-bottom:calc(160px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.barra{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:6px;
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:62px}
.barra h1{font-size:1.2rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-btn{all:unset;cursor:pointer;min-width:48px;min-height:48px;display:grid;place-items:center;font-size:1.5rem;border-radius:12px}
.ico-btn:active{background:var(--panel2)}
main{max-width:980px;margin:0 auto;padding:14px 16px;overflow-x:hidden}
.abajo{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--linea);display:grid;
  grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.abajo a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;color:var(--suave);text-decoration:none;
  font-size:.74rem;font-weight:700;white-space:nowrap}
.abajo a .ic{font-size:1.5rem;line-height:1}
.abajo a.activo{color:var(--acento)}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:16px 0 8px;color:var(--suave)}
p{margin:6px 0}
.suave{color:var(--suave)}.peq{font-size:.86rem}.num{font-variant-numeric:tabular-nums}
.bien{color:var(--bien)}.mal{color:var(--mal)}.aviso{color:var(--aviso)}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:10px 16px;border-radius:14px;border:2px solid transparent;
  font-size:1.05rem;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;background:none}
.btn:active{transform:scale(.98)}
.prim{background:var(--acento);color:var(--acento-t)}
.sec{background:var(--panel2);border-color:var(--linea)}
.peligro{background:transparent;border-color:var(--mal);color:var(--mal)}
.btn.chico{min-height:46px;font-size:.95rem;width:auto;padding:6px 14px}
.botones{display:grid;gap:10px;margin:14px 0}
.botones.dos{grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:6px 14px;border-radius:24px;border:2px solid var(--linea);background:var(--panel2);font-size:.95rem;font-weight:800;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acento);color:var(--acento-t);border-color:var(--acento)}
.chip small{font-weight:600;opacity:.8}
.desliza{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.desliza .chip{flex:0 0 auto}
.busca{position:relative}
.busca .ico-btn{position:absolute;right:4px;top:3px;font-size:1.2rem;color:var(--suave)}
.busca input{padding-right:52px}
.chip.limpiar{background:transparent;border-color:var(--aviso);color:var(--aviso)}
/* Sonar / Crear lista siempre a mano mientras se baja por la lista */
.acciones-fijas{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:3;background:var(--bg);display:grid;grid-template-columns:1.4fr 1fr;
  gap:10px;padding:10px 0;margin:4px 0}
.acciones-fijas .btn{min-height:54px}
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:14px;margin:12px 0}
.caja.aviso-c{border-color:var(--aviso)}
input,select,textarea{width:100%;min-height:54px;padding:10px 14px;background:var(--panel2);border:2px solid var(--linea);border-radius:14px;font-size:1.1rem}
input:focus,select:focus{outline:none;border-color:var(--acento)}
.campo{margin:12px 0}.campo>label{display:block;font-weight:800;margin:0 0 6px}
.ayuda{font-size:.86rem;color:var(--suave);margin-top:5px}

/* Tarjetas de métricas (se tocan) */
.tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.tarjetas{grid-template-columns:repeat(4,1fr)}}
.tarjeta{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;
  padding:14px;cursor:pointer;min-height:100px;position:relative}
.tarjeta:active{background:var(--panel2)}
.tarjeta::after{content:"›";position:absolute;right:12px;top:10px;font-size:1.3rem;color:var(--suave)}
.t-et{font-size:.86rem;color:var(--suave);font-weight:700;padding-right:16px}
.t-val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.t-sub{font-size:.82rem;color:var(--suave)}

/* Reproductor grande */
.repro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.portada{width:min(62vw,280px);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:clamp(3rem,18vw,6rem);font-weight:900;color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.35);user-select:none}
.r-titulo{font-size:1.55rem;font-weight:900;line-height:1.2;margin:4px 0 0;overflow-wrap:anywhere}
.r-artista{font-size:1.15rem;color:var(--suave);font-weight:700;overflow-wrap:anywhere}
.etq{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--linea)}
.progreso{width:100%;max-width:560px}
.progreso input[type=range]{min-height:44px;padding:0;background:none;border:0;accent-color:var(--acento)}
.tiempos{display:flex;justify-content:space-between;font-size:.9rem;color:var(--suave);font-variant-numeric:tabular-nums}
.controles{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0}
.ctl{all:unset;cursor:pointer;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;background:var(--panel2);border:2px solid var(--linea)}
.ctl.play{width:100px;height:100px;font-size:2.8rem;background:var(--acento);color:var(--acento-t);border:0}
.ctl:active{transform:scale(.94)}
.fila-iconos{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ib{all:unset;cursor:pointer;min-width:58px;min-height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--panel2);border:2px solid var(--linea)}
.ib.on{border-color:var(--acento);color:var(--acento)}
.ib.corazon.on{border-color:var(--corazon);color:var(--corazon)}
.estrellas{display:flex;gap:2px;justify-content:center}
.estrellas button{all:unset;cursor:pointer;font-size:2rem;min-width:44px;min-height:48px;display:grid;place-items:center;color:var(--linea)}
.estrellas button.on{color:var(--estrella)}
.estatus{font-weight:900;font-size:1rem}
.fuente{all:unset;box-sizing:border-box;cursor:pointer;width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;font-weight:800}

/* Modo carro: solo lo necesario, enorme */
body.carro .barra,body.carro .abajo,body.carro #mini{display:none!important}
body.carro{padding-bottom:0}
body.carro main{padding-top:calc(10px + env(safe-area-inset-top))}
body.carro .portada,body.carro .solo-normal{display:none!important}
body.carro .r-titulo{font-size:2rem}
body.carro .r-artista{font-size:1.4rem}
body.carro .controles{gap:10px;margin:18px 0}
body.carro .ctl{width:min(28vw,110px);height:min(28vw,110px);font-size:2.7rem}
body.carro .ctl.play{width:min(36vw,140px);height:min(36vw,140px);font-size:3.6rem}
body.carro .ib.corazon,body.carro .ib.flotante{min-width:110px;min-height:84px;font-size:2.6rem}
.solo-carro{display:none!important}
body.carro .solo-carro{display:flex!important}

/* Listas de canciones */
.lista{display:grid;gap:6px}
.cancion{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--linea);border-radius:14px;
  padding:8px 6px 8px 8px;cursor:pointer;min-height:64px}
.cancion.sonando{border-color:var(--acento)}
.cancion:active{background:var(--panel2)}
.mini-port{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.05rem}
.c-txt{min-width:0}
.c-txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.c-txt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.84rem;color:var(--suave)}
.c-der{display:flex;align-items:center;gap:2px}
.c-der .meta{font-size:.78rem;color:var(--suave);text-align:right;line-height:1.2}
.c-der .meta .e{color:var(--estrella)}.c-der .meta .h{color:var(--corazon)}
.mas-btn{all:unset;cursor:pointer;min-width:44px;min-height:48px;display:grid;place-items:center;font-size:1.4rem;color:var(--suave)}
.rank{font-weight:900;color:var(--suave);font-size:1rem;text-align:center}

/* Mini reproductor */
#mini{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;background:var(--panel2);border-top:1px solid var(--linea);
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px;padding:6px 10px;min-height:66px}
#mini .c-txt{cursor:pointer}
#mini .barrita{position:absolute;left:0;top:-3px;height:3px;background:var(--acento)}

/* Historial */
.hist{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.hist.deshecho{opacity:.55}
.hist .d{font-size:.84rem;color:var(--suave)}
.hist details summary{cursor:pointer;color:var(--acento);font-weight:700;min-height:36px;display:flex;align-items:center}
.hist details p{margin:4px 0;overflow-wrap:anywhere}

/* Selectores de varias opciones (listas inteligentes) */
details.sel{background:var(--panel2);border:1px solid var(--linea);border-radius:14px;margin:8px 0;padding:0 10px}
details.sel summary{cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;list-style:none}
details.sel summary::after{content:"▾";margin-left:auto;color:var(--suave)}
details.sel[open] summary::after{content:"▴"}
details.sel .sel-opc{max-height:240px;overflow:auto;padding-bottom:8px}
details.sel input[type=search]{min-height:46px;margin-bottom:4px}

/* Avisos y ventanas */
#toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:20;background:var(--bien);color:#062216;font-weight:800;
  padding:14px 16px;border-radius:14px;font-size:1.05rem;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(20px);transition:opacity .2s,transform .2s,visibility .2s}
#toast.ver{opacity:1;visibility:visible;transform:none}
#toast.error{background:var(--mal);color:#fff}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;padding:12px}
#modal.ver{display:flex}
#modal .hoja{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:18px 16px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
#modal h2{margin:0 0 10px}
.opcion{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 10px;border-radius:12px;font-weight:700}
.opcion:active{background:var(--panel2)}
.opcion .ic{font-size:1.35rem;width:30px;text-align:center}
.opcion input[type=checkbox]{width:26px;min-height:26px;height:26px;accent-color:var(--acento)}
#actualizar{display:none;position:fixed;top:calc(70px + env(safe-area-inset-top));left:16px;right:16px;z-index:15}
#actualizar.ver{display:flex}
.progreso-carga{height:12px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:8px 0}
.progreso-carga i{display:block;height:100%;background:var(--acento);width:0}
#arranque{padding:40px 16px;text-align:center;color:var(--suave)}
#fondo{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:4;background:var(--panel2);border-bottom:1px solid var(--linea);
  padding:8px 14px 12px;font-size:.88rem;color:var(--suave)}
#fondo b{color:var(--texto)}
#fondo i{position:absolute;left:0;bottom:0;height:4px;background:var(--acento);transition:width .4s}
body.carro #fondo{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="barra">
  <button class="ico-btn" id="atras" hidden aria-label="Volver" onclick="history.length>1?history.back():location.hash='#/sonando'">‹</button>
  <h1 id="titulo">Mi Música</h1>
  <button class="ico-btn" data-accion="modoCarro" aria-label="Modo carro">🚗</button>
</header>
<button class="btn prim" id="actualizar" data-accion="actualizarApp">🔄 Hay una versión nueva. Toca para actualizar</button>
<div id="fondo" hidden></div>
<main id="vista"><div id="arranque">Cargando…</div></main>
<div id="mini" hidden></div>
<nav class="abajo" id="nav">
  <a href="#/sonando" data-r="sonando"><span class="ic">🎵</span>Sonando</a>
  <a href="#/biblioteca" data-r="biblioteca"><span class="ic">📚</span>Biblioteca</a>
  <a href="#/listas" data-r="listas"><span class="ic">🗂️</span>Listas</a>
  <a href="#/top" data-r="top"><span class="ic">🏆</span>Estatus</a>
  <a href="#/mas" data-r="mas"><span class="ic">☰</span>Más</a>
</nav>
<audio id="audio" preload="auto"></audio>
<input type="file" id="elegirArchivos" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.flac,.wav" multiple hidden>
<input type="file" id="elegirCarpeta" webkitdirectory multiple hidden>
<input type="file" id="elegirRespaldo" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="hoja" id="modalHoja"></div></div>
<script>try{var t=localStorage.getItem('mm-tema');if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>
<script src="etiquetas.js" defer></script>
<script src="db.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
